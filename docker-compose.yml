version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: framelens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Database configuration
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: framelens_dev
      # Phoenix configuration
      PHX_HOST: localhost
      PORT: 4000
      SECRET_KEY_BASE: xtxVuImvW1nM2R9rQrDHw1ikCBpndMltfOhCpNa+sG2eCpP4o5LLOydCzNMRqEhX
      # Docker flag to bind to all interfaces
      DOCKER_ENV: "true"
      # Mix environment
      MIX_ENV: dev
    ports:
      - "4000:4000"
    volumes:
      # Mount the entire app for hot reloading
      - .:/app
      # Exclude deps and _build to avoid conflicts
      - /app/deps
      - /app/_build
      # Mount asset directories for hot reloading
      - ./assets:/app/assets
      - ./priv/static:/app/priv/static
      - ./lib:/app/lib
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "mix ecto.create && mix ecto.migrate && mix phx.server"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
